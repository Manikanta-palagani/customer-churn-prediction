
name: Customer Churn CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Validate Python Code
        run: python -m compileall -q app.py test_app.py

      - name: Run Automated Tests
        run: pytest test_app.py -v

      - name: Build Docker Image
        run: |
          docker build -t customer-churn-api:latest .

      - name: Login to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Docker Image
        if: github.event_name == 'push'
        run: |
          docker tag customer-churn-api:latest ghcr.io/${{ github.repository_owner }}/customer-churn-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/customer-churn-api:latest
